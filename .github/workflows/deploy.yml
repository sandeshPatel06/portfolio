name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Portfolio
    # Only run on pushes to main, manual dispatch, or when a PR is merged into main
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare Credentials
        id: check_token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Missing Secret::CLOUDFLARE_API_TOKEN is not set in GitHub Secrets. To enable automatic deployments from any system or PR merge, add CLOUDFLARE_API_TOKEN to repository Secrets."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check_token.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c04e720708dcb939e074ad0b1e594bf8
          command: pages deploy . --project-name=sandesh-portfolio --branch=main
